<title>InkBody — préparation de projets de tatouage</title>
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#141416; --bg2:#1b1b1f; --panel:#1f1f24; --panel2:#26262c; --line:#32323a; --line2:#3d3d46;
  --tx:#ededf1; --tx2:#a9a9b5; --tx3:#75757f; --acc:#c9a46a; --acc2:#e2c08a; --accbg:rgba(201,164,106,.14);
  --red:#e2604a; --green:#5fbf8a; --blue:#6aa7d9; --r:10px; --r2:14px;
  --top:56px; --left:288px; --right:316px; --bb:0px;
  --safeb:env(safe-area-inset-bottom,0px); --safet:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:var(--left) 1fr var(--right);grid-template-rows:var(--top) 1fr;grid-template-areas:"top top top" "left stage right"}
/* barre du haut */
#topbar{grid-area:top;display:flex;align-items:center;gap:8px;padding:0 12px;padding-top:var(--safet);background:var(--bg2);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;margin-right:6px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.brand b{color:var(--acc)}
.tb-sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--tx);white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:#2f2f37;border-color:#4a4a55}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#1a1408;font-weight:600}
.btn.primary:hover{background:var(--acc2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:#ffb4a8;border-color:#5a2c26;background:#2a1a18}
.btn.icon{width:36px;padding:0}
.btn.sm{min-height:30px;padding:0 9px;font-size:13px;border-radius:8px}
.btn.sm.icon{width:30px}
.btn.on{background:var(--accbg);border-color:var(--acc);color:var(--acc2)}
.btn svg{width:18px;height:18px;flex:none}
.projname{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.save-state{font-size:12px;color:var(--tx3);white-space:nowrap}
.save-state.err{color:var(--red)}
select.sel{min-height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);padding:0 8px;max-width:200px}
/* panneaux */
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
#left{grid-area:left;border-right:1px solid var(--line)}
#right{grid-area:right;border-left:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:8px 8px 0;border-bottom:1px solid var(--line);flex:none}
.tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:9px 4px 10px;color:var(--tx2);font-weight:600;font-size:13px}
.tab.on{color:var(--tx);border-bottom-color:var(--acc)}
.pbody{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.sheet-handle{display:none}
.sec{margin:0 0 16px}
.sec h4{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row>label{flex:1;min-width:90px;color:var(--tx2);font-size:13px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field>span{font-size:12px;color:var(--tx2)}
.inp{width:100%;min-height:36px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);padding:6px 9px}
textarea.inp{min-height:70px;resize:vertical}
.num{width:84px;min-height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--bg2);padding:4px 8px;text-align:right}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:10px}
.slider span{font-size:12.5px;color:var(--tx2)}
.slider output{font-size:12px;color:var(--tx3);text-align:right;font-variant-numeric:tabular-nums}
.slider input{grid-column:1/3}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--line2)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);margin-top:-8px;border:3px solid var(--panel)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid var(--panel)}
input[type=color]{width:40px;height:34px;border:1px solid var(--line2);border-radius:8px;background:var(--bg2);padding:2px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);margin-bottom:8px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:7px;padding:7px 6px;color:var(--tx2);font-size:13px;font-weight:600;min-height:32px}
.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--acc)}
.muted{color:var(--tx3);font-size:12.5px}
.note{font-size:12px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:12px}
.note.warn{border-color:#5d4a2a;background:#231d14;color:#e9d2a8}
.badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:6px;text-transform:uppercase}
.badge.ex{background:#23303a;color:#9fc7e6}
.badge.pr{background:var(--accbg);color:var(--acc2)}
.badge.ia{background:#2c2338;color:#c8a8ee}
/* bibliothèque */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.lib-item{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid var(--line2);overflow:hidden;background-color:#e9e9ec;background-image:linear-gradient(45deg,#cfcfd4 25%,transparent 25%,transparent 75%,#cfcfd4 75%),linear-gradient(45deg,#cfcfd4 25%,transparent 25%,transparent 75%,#cfcfd4 75%);background-size:14px 14px;background-position:0 0,7px 7px;padding:0}
.lib-item img{width:100%;height:100%;object-fit:contain;display:block;padding:6px}
.lib-item.on{outline:2px solid var(--acc);outline-offset:1px}
.lib-item .lname{position:absolute;left:0;right:0;bottom:0;background:rgba(15,15,18,.78);font-size:10.5px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#ddd}
.lib-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.drop{border:1.5px dashed var(--line2);border-radius:12px;padding:14px;text-align:center;color:var(--tx2);margin-bottom:12px}
.drop.over{border-color:var(--acc);background:var(--accbg)}
/* calques */
.layer{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--bg2);cursor:pointer}
.layer.on{border-color:var(--acc);background:var(--accbg)}
.layer .th{width:40px;height:40px;border-radius:7px;background:#e9e9ec;flex:none;object-fit:contain;padding:3px}
.layer .meta{flex:1;min-width:0}
.layer .meta b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .meta small{color:var(--tx3);font-size:11.5px}
.layer.hid .th{opacity:.35}
/* scène */
#stage{grid-area:stage;position:relative;min-width:0;min-height:0;background:radial-gradient(ellipse at 50% 40%,#2a2a30 0%,#18181b 70%)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#viewbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#viewbar>*{pointer-events:auto}
.glass{background:rgba(22,22,26,.82);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:11px}
#viewbar .grp{display:flex;padding:3px;gap:2px}
#viewbar .grp .btn{min-height:32px;border:none;background:transparent;padding:0 9px;font-size:12.5px}
#viewbar .grp .btn:hover{background:var(--panel2)}
#viewbar .grp .btn.on{background:var(--accbg);color:var(--acc2)}
#viewbar select{min-height:32px;border:none;background:transparent;padding:0 6px;font-size:12.5px}
#modebar{position:absolute;left:50%;bottom:calc(14px + var(--bb));transform:translateX(-50%);display:flex;padding:4px;gap:4px}
#modebar button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:74px;min-height:52px;border:none;border-radius:9px;background:transparent;color:var(--tx2);font-size:11.5px;font-weight:600;padding:6px 8px}
#modebar button svg{width:20px;height:20px}
#modebar button.on{background:var(--accbg);color:var(--acc2);box-shadow:inset 0 0 0 1px rgba(201,164,106,.5)}
#hint{position:absolute;left:50%;top:58px;transform:translateX(-50%);padding:8px 14px;font-size:13px;color:var(--tx);max-width:min(92%,520px);text-align:center;pointer-events:none;transition:opacity .2s}
#measureOut{position:absolute;right:10px;top:58px;padding:10px 12px;font-size:12.5px;max-width:280px}
#measureOut b{color:var(--acc2)}
#disclaimer{position:absolute;right:10px;bottom:calc(10px + var(--bb));font-size:11px;color:var(--tx3);max-width:240px;text-align:right;pointer-events:none}
#bottombar{display:none}
#loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:var(--bg);z-index:5;color:var(--tx2)}
.bar{width:220px;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
/* modales */
.modal-back{position:fixed;inset:0;background:rgba(5,5,7,.66);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;padding-bottom:calc(16px + var(--safeb))}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:var(--r2);width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal.wide{width:min(980px,100%)}
.modal.full{width:100%;height:100%;max-width:1400px}
.modal header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:16px;flex:1}
.modal .mbody{padding:14px;overflow:auto;flex:1;min-height:0}
.modal footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.menu{position:fixed;z-index:60;min-width:220px;padding:6px;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 10px;background:none;border:none;border-radius:8px;text-align:left;min-height:40px}
.menu button:hover{background:#34343c}
.menu hr{border:none;border-top:1px solid var(--line2);margin:5px 2px}
#toasts{position:fixed;left:50%;bottom:calc(90px + var(--safeb));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.toast{background:#2b2b32;border:1px solid var(--line2);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:tin .2s ease;pointer-events:auto}
.toast.err{border-color:#6a2f27;background:#2d1b18}
.toast.ok{border-color:#2f5a42}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* éditeurs 2D */
.ed{display:grid;grid-template-columns:260px 1fr;gap:0;height:100%;min-height:0}
.ed-side{border-right:1px solid var(--line);overflow:auto;padding:12px}
.ed-view{position:relative;overflow:hidden;touch-action:none;background-color:#d8d8dc;background-image:linear-gradient(45deg,#bdbdc3 25%,transparent 25%,transparent 75%,#bdbdc3 75%),linear-gradient(45deg,#bdbdc3 25%,transparent 25%,transparent 75%,#bdbdc3 75%);background-size:20px 20px;background-position:0 0,10px 10px}
.ed-view.dark{background-color:#2a2a2f;background-image:linear-gradient(45deg,#232327 25%,transparent 25%,transparent 75%,#232327 75%),linear-gradient(45deg,#232327 25%,transparent 25%,transparent 75%,#232327 75%)}
.ed-view canvas{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:auto}
.ed-view .ov{position:absolute;inset:0;pointer-events:none}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.tools button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);font-size:11.5px;min-height:56px}
.tools button svg{width:20px;height:20px}
.tools button.on{border-color:var(--acc);background:var(--accbg);color:var(--acc2)}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;padding:4px}
.facepin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:2px solid #fff;background:rgba(201,164,106,.55);box-shadow:0 0 0 2px rgba(0,0,0,.5);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#111}
.cropbox{position:absolute;border:2px solid var(--acc);box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:auto;touch-action:none}
.cropbox i{position:absolute;width:22px;height:22px;background:var(--acc);border:2px solid #111;border-radius:50%}
.cropbox i[data-h=nw]{left:-12px;top:-12px}.cropbox i[data-h=ne]{right:-12px;top:-12px}.cropbox i[data-h=sw]{left:-12px;bottom:-12px}.cropbox i[data-h=se]{right:-12px;bottom:-12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.thumbs figure{margin:0;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px}
.thumbs img{width:100%;border-radius:6px;display:block;background:#e7e7ea}
.thumbs figcaption{font-size:12px;color:var(--tx2);margin-top:6px;display:flex;gap:6px;align-items:center;justify-content:space-between}
.guide-step{display:flex;gap:12px;margin-bottom:14px}
.guide-step .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accbg);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:800}
.guide-step p{margin:3px 0 0;color:var(--tx2);font-size:13px}
table.lst{width:100%;border-collapse:collapse;font-size:13px}
table.lst td,table.lst th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.lst tr.cur td{background:var(--accbg)}
.kbd{font-size:11px;padding:1px 5px;border:1px solid var(--line2);border-radius:4px;color:var(--tx3)}
#printArea{display:none}
@media print{
  body{background:#fff;overflow:visible}
  #app,.modal-back,#toasts,.menu{display:none!important}
  #printArea{display:block}
  #printArea img{width:100%;page-break-after:always;display:block}
}
/* ---------- mobile ---------- */
@media (max-width:1100px){
  :root{--top:50px;--bb:calc(64px + var(--safeb))}
  #app{grid-template-columns:1fr;grid-template-rows:calc(var(--top) + var(--safet)) 1fr;grid-template-areas:"top" "stage"}
  #topbar{padding:var(--safet) 8px 0;gap:4px}
  .brand span{display:none}
  .desk{display:none!important}
  .projname{max-width:120px}
  .panel{position:fixed;left:0;right:0;bottom:var(--bb);max-height:58vh;z-index:20;border:none;border-top:1px solid var(--line2);border-radius:16px 16px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .22s ease;visibility:hidden}
  .panel.open{transform:none;visibility:visible}
  .panel.min{max-height:36vh}
  .sheet-handle{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 0;min-height:40px;cursor:pointer}
  .sheet-handle i{width:40px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto}
  #bottombar{display:flex;position:fixed;left:0;right:0;bottom:0;height:var(--bb);padding:6px 4px var(--safeb);background:var(--bg2);border-top:1px solid var(--line);z-index:25;justify-content:space-around}
  #bottombar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;color:var(--tx2);font-size:10.5px;font-weight:600;border-radius:10px;margin:0 2px;min-height:50px}
  #bottombar button svg{width:22px;height:22px}
  #bottombar button.on{color:var(--acc2);background:var(--accbg)}
  #modebar{display:none}
  #viewbar{top:8px;left:8px;right:8px}
  #viewbar .grp .btn{padding:0 7px;font-size:12px}
  #hint{top:52px;font-size:12.5px}
  #measureOut{top:auto;bottom:calc(var(--bb) + 10px);right:8px;left:8px;max-width:none}
  #disclaimer{bottom:calc(var(--bb) + 6px);font-size:10px;max-width:60%}
  .ed{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .ed-side{border-right:none;border-top:1px solid var(--line);max-height:42vh;order:2}
  .modal-back{padding:0}
  .modal{border-radius:0;height:100%;width:100%}
  .modal:not(.full){height:auto;max-height:100%;border-radius:14px 14px 0 0;align-self:flex-end}
  #toasts{bottom:auto;top:calc(var(--top) + var(--safet) + 64px)}
}
@media (min-width:1101px){ .mob{display:none!important} }

<script type="module">
// ============================================================================
// InkBody — application de préparation de projets de tatouage (100 % locale)
// Dépendances embarquées : three.js r170, three-mesh-bvh 0.8.3 (MIT)
// ============================================================================
import * as THREE from './assets/lib/three.module.min.js';
import { OrbitControls } from './assets/lib/addons/OrbitControls.js';
import { GLTFLoader } from './assets/lib/addons/GLTFLoader.js';
import { mergeVertices } from './assets/lib/addons/BufferGeometryUtils.js';
import { RoomEnvironment } from './assets/lib/addons/RoomEnvironment.js';
import { MeshBVH, acceleratedRaycast } from './assets/lib/three-mesh-bvh.module.js';
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const APP_VERSION = '3.0.0';
const PROJECT_FORMAT = 'inkbody-project';
const PROJECT_VERSION = 1;
const EXPORT_FORMAT = 'inkbody-export';
const MAX_FILE_MB = 25;            // limite d'import par fichier image
const MAX_WORK_PX = 2048;          // taille de travail max des motifs (l'original est conservé)
const IS_PHONE = typeof matchMedia !== 'undefined' && matchMedia('(max-width:699px)').matches;
const MAX_TEX_PX = IS_PHONE ? 1536 : 2048; // taille max des textures GPU (mémoire réduite sur iPhone)
const MAX_MODEL_MB = 40;           // limite d'import GLB
const IS_TOUCH = matchMedia('(pointer:coarse)').matches;
const isMobile = () => matchMedia('(max-width:1100px)').matches; // téléphone ou tablette en portrait : 3D plein écran + panneaux repliables
const isTablet = () => matchMedia('(max-width:1100px) and (min-width:700px)').matches;

// ---------------------------------------------------------------- utilitaires
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'html') el.innerHTML = v;
    else if (k in el && typeof v !== 'string') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) el.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return el;
}
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const fmt = (n, d = 1) => Number(n).toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });
const deepClone = (o) => JSON.parse(JSON.stringify(o));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function slug(s) { return (s || 'projet').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase().slice(0, 50) || 'projet'; }

function toast(msg, type = '', ms = 3200) {
  const t = h('div', { class: 'toast ' + type }, msg);
  if (matchMedia('(max-width:699px)').matches) { $$('#toasts .toast').forEach(n => n.remove()); ms = Math.min(ms, type === 'err' ? 5000 : 3000); } // iPhone : un seul message, en bas, bref
  $('#toasts').append(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 320); }, ms);
}
// export « fond blanc » d'une image de motif (pour récupérer le dessin)
async function whiteBg(imageId) { const img = await Images.bitmap(imageId); const c = newCanvas(img.width, img.height), g = ctx2d(c); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0); return canvasToBlob(c); }
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}
const canvasToBlob = (c, type = 'image/png', q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Conversion image impossible')), type, q));
function blobToDataURL(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
async function dataURLToBlob(d) { return (await fetch(d)).blob(); }
async function blobToImage(blob) {
  if ('createImageBitmap' in window) {
    try { return await createImageBitmap(blob, { imageOrientation: 'from-image' }); } catch (e) { /* repli */ }
  }
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob); const img = new Image();
    img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 1000); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Image illisible ou format non pris en charge')); };
    img.src = url;
  });
}
function newCanvas(w, hgt) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(hgt)); return c; }
function ctx2d(c) { return c.getContext('2d', { willReadFrequently: true }); }
function imageToCanvas(img, maxSide = Infinity) {
  const w = img.width || img.naturalWidth, hh = img.height || img.naturalHeight;
  const s = Math.min(1, maxSide / Math.max(w, hh));
  const c = newCanvas(w * s, hh * s); const g = ctx2d(c);
  g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height); return c;
}
function canvasHasAlpha(c) {
  const d = ctx2d(c).getImageData(0, 0, c.width, c.height).data;
  let n = 0; for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { if (++n > 50) return true; }
  return false;
}
function trimCanvas(c, pad = 2) {
  const g = ctx2d(c); const { width: w, height: hh } = c; const d = g.getImageData(0, 0, w, hh).data;
  let x0 = w, y0 = hh, x1 = -1, y1 = -1;
  for (let y = 0; y < hh; y++) for (let x = 0; x < w; x++) if (d[(y * w + x) * 4 + 3] > 6) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0) return c;
  x0 = Math.max(0, x0 - pad); y0 = Math.max(0, y0 - pad); x1 = Math.min(w - 1, x1 + pad); y1 = Math.min(hh - 1, y1 + pad);
  const o = newCanvas(x1 - x0 + 1, y1 - y0 + 1); ctx2d(o).drawImage(c, -x0, -y0); return o;
}

// ---------------------------------------------------------------- IndexedDB
const DB = {
  db: null,
  open() {
    // Safari 14.1–15 : le premier indexedDB.open() peut rester sans réponse tant que le moteur n'est pas « réveillé »
    const wake = () => new Promise((res) => {
      if (!window.indexedDB || !indexedDB.databases || !/Safari/.test(navigator.userAgent) || /Chrome|Android/.test(navigator.userAgent)) return res();
      let n = 0, done = false; const ok = () => { done = true; res(); };
      const tick = () => { if (done) return; indexedDB.databases().then(ok, ok); if (++n < 50) setTimeout(tick, 100); else ok(); }; tick();
    });
    const attempt = () => new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('IndexedDB indisponible'));
      const r = indexedDB.open('inkbody', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('projects')) d.createObjectStore('projects', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('images')) d.createObjectStore('images', { keyPath: 'id' });
      };
      r.onsuccess = () => { this.db = r.result; res(this.db); };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Base locale bloquée par un autre onglet'));
    });
    const timeout = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error('La base locale ne répond pas')), ms));
    return wake().then(() => Promise.race([attempt(), timeout(6000)])).catch((e) => Promise.race([attempt(), timeout(6000)]));
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store);
      let out; const r = fn(s); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Transaction annulée'));
    });
  },
  put(store, v) { return this.tx(store, 'readwrite', s => s.put(v)); },
  get(store, k) { return this.tx(store, 'readonly', s => s.get(k)); },
  del(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  keys(store) { return this.tx(store, 'readonly', s => s.getAllKeys()); },
  clear(store) { return this.tx(store, 'readwrite', s => s.clear()); },
};
function isQuotaError(e) { return e && (e.name === 'QuotaExceededError' || e.code === 22 || /quota/i.test(e.message || '')); }
function storageErrorMessage(e) {
  if (isQuotaError(e)) return 'Espace de stockage du navigateur plein. Exportez une sauvegarde puis supprimez d’anciens projets ou motifs.';
  return 'Erreur d’enregistrement local : ' + (e && e.message || e);
}

// Images : cache mémoire + IndexedDB
const Images = {
  cache: new Map(), // id -> {blob, url, bmp}
  async save(blob, meta = {}) {
    // une image utilisée par un tatouage verrouillé n'est jamais réécrite (les ajouts reçoivent toujours de nouveaux identifiants)
    if (meta.id && typeof S !== 'undefined' && S.project && S.project.variants.some(v => v.tattoos.some(t => t.imageId === meta.id && (t.locked || t.status === 'existing')))) throw new Error('Image d’un tatouage protégé : écriture refusée');
    const id = meta.id || uid('img_');
    await DB.put('images', { id, blob, type: blob.type, size: blob.size, w: meta.w || 0, h: meta.h || 0, createdAt: Date.now() });
    this.cache.set(id, { blob });
    return id;
  },
  async blob(id) {
    if (!id) return null;
    const c = this.cache.get(id); if (c && c.blob) return c.blob;
    const r = await DB.get('images', id); if (!r) return null;
    this.cache.set(id, { blob: r.blob }); return r.blob;
  },
  async url(id) {
    const c = this.cache.get(id); if (c && c.url) return c.url;
    const b = await this.blob(id); if (!b) return '';
    const url = URL.createObjectURL(b); this.cache.set(id, { ...(this.cache.get(id) || {}), blob: b, url }); return url;
  },
  async bitmap(id) {
    const c = this.cache.get(id); if (c && c.bmp) return c.bmp;
    const b = await this.blob(id); if (!b) throw new Error('Image introuvable dans la base locale');
    const bmp = await blobToImage(b); this.cache.set(id, { ...(this.cache.get(id) || {}), blob: b, bmp }); return bmp;
  },
  async remove(id) { const c = this.cache.get(id); if (c && c.url) URL.revokeObjectURL(c.url); this.cache.delete(id); await DB.del('images', id); },
};

// ---------------------------------------------------------------- modèle de projet
const DEFAULT_PARAMS = { gender: 0, muscle: 0, corpulence: 0, shoulders: 0, chest: 0, waist: 0, hips: 0, breasts: 0, upperarm: 0, forearm: 0, thigh: 0, calf: 0, legs: 0 };
const PRESETS = {
  neutre: { label: 'Neutre', p: {} },
  masculine: { label: 'Homme', p: { gender: 1, muscle: 0.15 } },
  feminine: { label: 'Femme', p: { gender: -1, breasts: 0.1 } },
  athletique: { label: 'Athlétique', p: { gender: 0.85, muscle: 0.85, corpulence: -0.25, shoulders: 0.4 } },
  athletiqueF: { label: 'Sportive', p: { gender: -0.9, muscle: 0.6, corpulence: -0.3 } },

}

// ---------------------------------------------------------------- peau : matériau physique + diffusion sous-cutanée approchée
// (lumière qui « rougit » dans les zones rasantes et sur les contours, comme une vraie peau), reflets doux, micro-voile
function skinMaterial() {
  const m = new THREE.MeshPhysicalMaterial({ color: 0xc99b7d, roughness: 0.5, metalness: 0, specularIntensity: 0.45, specularColor: new THREE.Color(0xffe6dc),
    sheen: 0.3, sheenRoughness: 0.5, sheenColor: new THREE.Color(0xff9c85), clearcoat: 0.04, clearcoatRoughness: 0.55, envMapIntensity: 0.5 });
  m.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
      { float fres = 1.0 - clamp(dot(normalize(normal), normalize(vViewPosition)), 0.0, 1.0);
        totalEmissiveRadiance += diffuseColor.rgb * vec3(0.75, 0.22, 0.14) * (0.12 * fres * fres * fres); }`);
  };
  m.customProgramCacheKey = () => 'inkSkin1';
  return m;
}

  // ---- chargement du corps humain (maillage + morphologies MakeHuman, CC0)
  async loadHuman(onProgress) {

const Interact = {
  pointers: new Map(), drag: null, down: null,
  init() {
    const cv = Engine.canvas; this.ray = new THREE.Raycaster(); this.ndc = new THREE.Vector2();
    cv.addEventListener('pointerdown', (e) => this.onDown(e));
    cv.addEventListener('pointermove', (e) => this.onMove(e));
    cv.addEventListener('pointerup', (e) => this.onUp(e));
    cv.addEventListener('pointercancel', (e) => this.onUp(e, true));
    cv.addEventListener('contextmenu', (e) => e.preventDefault());
    cv.addEventListener('wheel', (e) => { // mode Déplacer : molette = taille, Maj + molette = rotation du motif sélectionné
      const t = this.gestureTarget(); if (!t) return; e.preventDefault(); e.stopPropagation(); History.record(t.id + 'wheel');
      if (e.shiftKey) t.rotation = Math.round((((t.rotation + Math.sign(e.deltaY) * 3) % 360) + 540) % 360 - 180);
      else { const f = Math.exp(-e.deltaY * 0.0015); t.widthCm = +clamp(t.widthCm * f, 0.5, 120).toFixed(1); t.heightCm = +clamp(t.heightCm * f, 0.5, 120).toFixed(1); }
      if (!this.praf) this.praf = requestAnimationFrame(() => { this.praf = null; Decals.build(t); }); clearTimeout(this._wt); this._wt = setTimeout(() => { Save.mark(); UI.renderRight(); }, 300);
    }, { passive: false, capture: true });
  },
  setRay(e) {
    const r = Engine.canvas.getBoundingClientRect();
    this.ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    this.ray.setFromCamera(this.ndc, Engine.camera);
  },
  gestureTarget() { const t = S.mode === 'move' && S.selected; return t && !t.locked && t.visible ? t : null; },
  startPinch() {
    const t = this.gestureTarget(); if (!t) return false;
    const [p1, p2] = [...this.pointers.values()];
    this.pinch = { t, d0: Math.hypot(p2.x - p1.x, p2.y - p1.y), a0: Math.atan2(p2.y - p1.y, p2.x - p1.x), w: t.widthCm, h: t.heightCm, r: t.rotation };
    Engine.controls.enabled = false; History.record(t.id + 'pinch'); return true;
  },
  onDown(e) {
    this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pointers.size === 2 && this.startPinch()) { this.cancelDrag(); this.down = null; Engine.controls.enabled = false; return; }
    if (this.pointers.size > 1) { this.cancelDrag(); this.down = null; return; }
    this.down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId, button: e.button };
    if (S.mode === 'move' && e.button === 0) {
      this.setRay(e);
      const id = Decals.pick(this.ray) || (S.selected && this.hitsSelected() ? S.selectedId : null);
      const t = id && S.tattoos.find(x => x.id === id);
      if (t) {
        if (S.selectedId !== id) App.select(id);
        if (t.locked) { toast('Motif verrouillé : déverrouillez-le pour le déplacer.'); return; }
        History.record(); this.drag = { t, moved: false }; Engine.controls.enabled = false;
        Engine.canvas.setPointerCapture(e.pointerId);
      }
    }
  },
  hitsSelected() { const r = Decals.objects.get(S.selectedId); if (!r) return false; return this.ray.intersectObject(r.mesh, false).length > 0; },
  onMove(e) {
    if (this.pointers.has(e.pointerId)) this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pinch && this.pointers.size === 2) { // pincer = taille, tourner = rotation (motif sélectionné, mode Déplacer)
      const P = this.pinch, [p1, p2] = [...this.pointers.values()]; const sc = clamp(Math.hypot(p2.x - p1.x, p2.y - p1.y) / Math.max(10, P.d0), 0.2, 5);
      const da = (Math.atan2(p2.y - p1.y, p2.x - p1.x) - P.a0) * 180 / Math.PI;
      P.t.widthCm = +clamp(P.w * sc, 0.5, 120).toFixed(1); P.t.heightCm = +clamp(P.h * sc, 0.5, 120).toFixed(1); P.t.rotation = Math.round((((P.r - da) % 360) + 540) % 360 - 180);
      if (!this.praf) this.praf = requestAnimationFrame(() => { this.praf = null; Decals.build(P.t); });
      return;
    }
    if (!this.drag) return;
    this.lastMove = e;
    if (this.raf) return;
    this.raf = requestAnimationFrame(() => {
      this.raf = null; const ev = this.lastMove; if (!this.drag) return;
      this.setRay(ev); const hit = Body.raycast(this.ray);
      if (hit) { App.moveTo(this.drag.t, hit); this.drag.moved = true; }
    });
  },
  onUp(e, cancel) {
    this.pointers.delete(e.pointerId);
    if (this.pinch) { if (this.pointers.size < 2) { this.pinch = null; Engine.controls.enabled = !this.gestureTarget(); Save.mark(); UI.renderRight(); UI.renderLayers(); } this.down = null; return; }
    if (this.drag) {
      const d = this.drag; this.drag = null; Engine.controls.enabled = true;
      if (d.moved) { Save.mark(); UI.renderRight(); UI.renderLayers(); } else History.undo.pop(), History.ui();
      this.down = null; return;
    }
    const d = this.down; this.down = null;
    if (cancel || !d || d.id !== e.pointerId) return;
    const dist = Math.hypot(e.clientX - d.x, e.clientY - d.y);
    if (dist < (IS_TOUCH ? 10 : 5) && performance.now() - d.t < 600 && d.button === 0) this.tap(e);
  },
  cancelDrag() { if (this.drag) { this.drag = null; Engine.controls.enabled = true; } },
  tap(e) {
    this.setRay(e);
    if (S.mode === 'measure') { const hit = Body.raycast(this.ray); if (hit) Measure.addPoint(hit); return; }
    if (S.mode === 'place' && S.pendingLibId) {
      const onTattoo = Decals.pick(this.ray);
      if (onTattoo) { App.select(onTattoo); return; }
      const lib = S.lib(S.pendingLibId); const hit = Body.raycast(this.ray);
      if (lib && hit) { App.addTattoo(lib, hit); return; }
      if (!hit) toast('Touchez directement la peau de l’avatar.');
      return;
    }
    const id = Decals.pick(this.ray);
    if (id) { App.select(id); return; }
    if (S.mode === 'place' && !S.pendingLibId) { UI.hint('Choisissez d’abord un motif dans la bibliothèque (Motifs).'); if (isMobile()) UI.openSheet('left'); return; }
    if (S.selectedId) App.select(null);
  },
};

function openModal({ title, body, actions = [], size = '', onClose, closable = true }) {
  const back = h('div', { class: 'modal-back' });
  const close = () => { back.remove(); document.removeEventListener('keydown', esc); onClose && onClose(); };
  const esc = (e) => { if (e.key === 'Escape' && closable) close(); };
  const m = h('div', { class: 'modal ' + size, role: 'dialog', 'aria-label': title },
    h('header', {}, h('h3', {}, title), closable ? h('button', { class: 'btn icon ghost', title: 'Fermer', onclick: close }, '✕') : null),
    h('div', { class: 'mbody' }, body),
    actions.length ? h('footer', {}, actions.map(a => h('button', { class: 'btn ' + (a.cls || ''), onclick: () => a.onClick(close), disabled: a.disabled }, a.label))) : null);
  back.append(m); back.addEventListener('pointerdown', (e) => { if (e.target === back && closable && size !== 'full') close(); });
  document.addEventListener('keydown', esc); document.body.append(back);
  return { close, el: m, body: m.querySelector('.mbody') };
}
function openMenu(anchor, items) {
  const back = h('div', { style: { position: 'fixed', inset: 0, zIndex: 59 } });
  const m = h('div', { class: 'menu' });

  for (const it of items) {
    if (it === '-') { m.append(h('hr')); continue; }

// ---- vue zoomable commune (pinch, molette, glisser)
class ZoomView {
  constructor(viewEl, canvas, { onTool } = {}) {
    this.el = viewEl; this.cv = canvas; this.s = 1; this.tx = 0; this.ty = 0; this.onTool = onTool; this.ptrs = new Map(); this.pan = false;
    viewEl.addEventListener('wheel', (e) => { e.preventDefault(); const r = viewEl.getBoundingClientRect(); this.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
    viewEl.addEventListener('pointerdown', (e) => this.down(e));
    viewEl.addEventListener('pointermove', (e) => this.move(e));
    viewEl.addEventListener('pointerup', (e) => this.up(e)); viewEl.addEventListener('pointercancel', (e) => this.up(e));
  }
  fit() { const r = this.el.getBoundingClientRect(); const W = this.cv.width, H = this.cv.height; this.s = Math.min((r.width - 30) / W, (r.height - 30) / H, 4); this.tx = (r.width - W * this.s) / 2; this.ty = (r.height - H * this.s) / 2; this.apply(); }
  apply() { this.cv.style.transform = `translate(${this.tx}px,${this.ty}px) scale(${this.s})`; this.el.querySelectorAll('canvas.ed-layer').forEach(c => c.style.transform = this.cv.style.transform); this.onChange && this.onChange(); }
  zoomAt(x, y, f) { const ns = clamp(this.s * f, 0.03, 30); this.tx = x - (x - this.tx) * ns / this.s; this.ty = y - (y - this.ty) * ns / this.s; this.s = ns; this.apply(); }
  toImg(e) { const r = this.el.getBoundingClientRect(); return { x: (e.clientX - r.left - this.tx) / this.s, y: (e.clientY - r.top - this.ty) / this.s }; }
  down(e) {
    this.el.setPointerCapture(e.pointerId); this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.ptrs.size === 2) { this.onTool && this.onTool('cancel'); const [a, b] = [...this.ptrs.values()]; this.pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 }; return; }
    this.pan = this.tool === 'pan' || e.button === 1 || e.button === 2;
    if (this.pan) { this.last = { x: e.clientX, y: e.clientY }; return; }
    this.onTool && this.onTool('down', this.toImg(e), e);
  }
  move(e) {
    if (!this.ptrs.has(e.pointerId)) { this.onTool && this.onTool('hover', this.toImg(e), e); return; }
    this.ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (this.pinch && this.ptrs.size === 2) {
      const [a, b] = [...this.ptrs.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      const r = this.el.getBoundingClientRect(); this.tx += cx - this.pinch.cx; this.ty += cy - this.pinch.cy;
      this.zoomAt(cx - r.left, cy - r.top, d / this.pinch.d); this.pinch = { d, cx, cy }; return;
    }
    if (this.pan) { this.tx += e.clientX - this.last.x; this.ty += e.clientY - this.last.y; this.last = { x: e.clientX, y: e.clientY }; this.apply(); return; }
    this.onTool && this.onTool('move', this.toImg(e), e);
  }
  up(e) {
    this.ptrs.delete(e.pointerId);
    if (this.pinch) { if (this.ptrs.size < 2) this.pinch = null; return; }
    if (this.pan) { this.pan = false; return; }
    this.onTool && this.onTool('up', this.toImg(e), e);
  }
}

// ---------------------------------------------------------------- import
const Importer = {
  async files(list) {
    if (!list.length) return;
    const ok = [], bad = [];
    for (const f of list) {
      const typeOk = /^image\/(png|jpeg|webp)$/.test(f.type) || /\.(png|jpe?g|webp)$/i.test(f.name);
      if (!typeOk) bad.push(f.name + ' (format non pris en charge)');
      else if (f.size > MAX_FILE_MB * 1e6) bad.push(f.name + ' (plus de ' + MAX_FILE_MB + ' Mo)');
      else ok.push(f);
    }
    if (bad.length) toast('Ignoré : ' + bad.join(', '), 'err', 6000);
    if (!ok.length) return;
    UI.closeSheets();
    for (let i = 0; i < ok.length; i++) {
      const f = ok[i];
      let img;
      try { img = await blobToImage(f); } catch (e) { toast(f.name + ' : ' + e.message, 'err'); continue; }
      const r = await Editor.open({ source: img, name: f.name.replace(/\.[^.]+$/, ''), original: f, queue: ok.length > 1 ? { i: i + 1, n: ok.length } : null });
      if (r === 'stop') break;
    }
  },
  async samples() {
    const list = [['mandala.svg', 'Mandala (exemple)'], ['hirondelle.svg', 'Hirondelle (exemple)'], ['rose-lignes.svg', 'Rose fine line (exemple)']];
    const busy = Busy.show('Ajout des motifs d’exemple…');
    try {
      for (const [f, name] of list) {
        const res = await fetch('assets/samples/' + f); if (!res.ok) throw new Error('fichier ' + f + ' introuvable');
        const svg = await res.blob(); const img = await blobToImage(svg);
        const c = newCanvas(1024, 1024 * (img.height / img.width || 1)); ctx2d(c).drawImage(img, 0, 0, c.width, c.height);
        const t = trimCanvas(c); await App.addLibrary({ blob: await canvasToBlob(t), name, source: 'exemple', w: t.width, h: t.height });
      }
      toast('3 motifs d’exemple ajoutés.', 'ok');
    } catch (e) { toast('Exemples indisponibles : ' + e.message, 'err'); }
    finally { busy.close(); }
  },
};

// ré-échantillonnage bilinéaire : pour chaque pixel de sortie, f(x,y) donne la position source
function remap(src, out, f) {
  const sw = src.width, sh = src.height; const sd = ctx2d(src).getImageData(0, 0, sw, sh).data;
  const og = ctx2d(out); const od = og.createImageData(out.width, out.height); const o = od.data;
  for (let y = 0; y < out.height; y++) for (let x = 0; x < out.width; x++) {
    const [fx, fy] = f(x + 0.5, y + 0.5); const X = fx - 0.5, Y = fy - 0.5;
    if (X < -0.5 || Y < -0.5 || X > sw - 0.5 || Y > sh - 0.5) continue;
    const x0 = clamp(Math.floor(X), 0, sw - 1), y0 = clamp(Math.floor(Y), 0, sh - 1), x1 = Math.min(sw - 1, x0 + 1), y1 = Math.min(sh - 1, y0 + 1);
    const ax = clamp(X - x0, 0, 1), ay = clamp(Y - y0, 0, 1); const oi = (y * out.width + x) * 4;
    const i00 = (y0 * sw + x0) * 4, i10 = (y0 * sw + x1) * 4, i01 = (y1 * sw + x0) * 4, i11 = (y1 * sw + x1) * 4;
    // interpolation prémultipliée (pas de halo sur les bords transparents)
    const w00 = (1 - ax) * (1 - ay) * sd[i00 + 3], w10 = ax * (1 - ay) * sd[i10 + 3], w01 = (1 - ax) * ay * sd[i01 + 3], w11 = ax * ay * sd[i11 + 3];
    const A = w00 + w10 + w01 + w11;
    if (A > 0) for (let c = 0; c < 3; c++) o[oi + c] = (sd[i00 + c] * w00 + sd[i10 + c] * w10 + sd[i01 + c] * w01 + sd[i11 + c] * w11) / A;
    o[oi + 3] = A;

// homographie envoyant les points src vers dst (8 inconnues, élimination de Gauss)
function homography(src, dst) {
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [x, y] = src[i], [u, v] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
    A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
  }
  for (let c = 0; c < 8; c++) {
    let piv = c; for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    if (Math.abs(A[piv][c]) < 1e-10) return null;
    [A[c], A[piv]] = [A[piv], A[c]]; [b[c], b[piv]] = [b[piv], b[c]];
    for (let r = 0; r < 8; r++) { if (r === c) continue; const f = A[r][c] / A[c][c]; for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k]; b[r] -= f * b[c]; }
  }
  return b.map((v, i) => v / A[i][i]);
}

function wrapText(g, text, maxW, font) {

  return out.slice(0, 8);
}

async function gcImages() {
  try {
    await Save.flush();
    const used = new Set(); for (const p of await DB.all('projects')) imageIdsOfProject(p).forEach(id => used.add(id));
    imageIdsOfProject(S.project).forEach(id => used.add(id));
    // les motifs encore référencés par l'historique d'annulation de la session sont conservés
    for (const snap of History.undo) { try { const o = JSON.parse(snap); imageIdsOfProject({ ...S.project, ...o }).forEach(id => used.add(id)); } catch (e) { /* */ } }
    for (const id of await DB.keys('images')) if (!used.has(id)) await Images.remove(id);
  } catch (e) { /* non bloquant */ }
}

  const cs = [corner(2, 2), corner(W - 3, 2), corner(2, H - 3), corner(W - 3, H - 3)];

function wireUI() {
  $$('[data-ltab]').forEach(b => b.onclick = () => UI.setLTab(b.dataset.ltab));
  $$('[data-rtab]').forEach(b => b.onclick = () => UI.setRTab(b.dataset.rtab));

  $$('.sheet-handle').forEach(hd => {
    hd.addEventListener('click', (e) => { if (e.target.closest('button') || hd._swiped) return; const p = hd.parentElement; p.classList.toggle('min'); UI.syncInset(); });
    // glisser la poignée : vers le bas = réduire puis fermer, vers le haut = agrandir
    let y0 = null; hd.addEventListener('pointerdown', (e) => { if (e.target.closest('button')) return; y0 = e.clientY; hd._swiped = false; });
    hd.addEventListener('pointerup', (e) => { if (y0 == null) return; const dy = e.clientY - y0; y0 = null; const p = hd.parentElement;
      if (dy > 45) { hd._swiped = true; if (p.classList.contains('min')) UI.closeSheets(); else { p.classList.add('min'); UI.syncInset(); } }
      else if (dy < -45) { hd._swiped = true; p.classList.remove('min'); UI.syncInset(); } });
  });
  addEventListener('resize', debounce(() => UI.syncInset(), 150));
  $$('[data-view]').forEach(b => b.onclick = () => Engine.setView(b.dataset.view));
  $$('[data-mode]').forEach(b => b.onclick = () => { setMode(b.dataset.mode); if (b.dataset.mode !== 'orbit') UI.closeSheets(); });
  $$('#bottombar [data-bb]').forEach(b => b.onclick = () => { const w = b.dataset.bb; UI.toggleSheet(w); if (w === 'left') UI.setLTab(S.ltab); });
  const zones = [['head', 'Tête'], ['neck', 'Cou'], ['chest', 'Torse'], ['back', 'Dos'], ['upperarm_l', 'Bras gauche'], ['upperarm_r', 'Bras droit'], ['forearm_l', 'Avant-bras gauche'], ['forearm_r', 'Avant-bras droit'], ['hands', 'Mains'], ['thighs', 'Cuisses'], ['calves', 'Mollets'], ['feet', 'Pieds']];
  const zs = $('#zoneSel'); zones.forEach(([v, l]) => zs.append(h('option', { value: v }, l)));
  zs.onchange = () => { const p = Engine.zonePose(zs.value); if (p) Engine.flyTo(p.target, p.position); zs.value = ''; };
  $('#btnGrid').onclick = () => { const on = !S.project.settings.grid; S.project.settings.grid = on; Engine.setGrid(on); $('#btnGrid').classList.toggle('on', on); Save.mark(); };
  $('#btnUndo').onclick = () => History.doUndo(); $('#btnRedo').onclick = () => History.doRedo();
  $('#variantSel').onchange = (e) => App.switchVariant(e.target.value);
  $('#btnVariantMenu').onclick = (e) => Variants.menu(e.currentTarget);
  $('#btnProjects').onclick = () => Projects.open();
  $('#btnExport').onclick = (e) => Export.menu(e.currentTarget);
  $('#btnExportM').onclick = (e) => Export.menu(e.currentTarget);
  $('#btnAI').onclick = () => AI.open();
  $('#btnHelp').onclick = () => showGuide();
  $('#btnMore').onclick = (e) => openMenu(e.currentTarget, [
    { label: 'Mes projets', onClick: () => Projects.open() },
    { label: 'Variantes (' + S.variant.name + ')…', onClick: () => Variants.menu($('#btnMore')) },
    { label: 'Avatar', onClick: () => { UI.openSheet('right'); UI.setRTab('avatar'); } },
    { label: 'Mesures', onClick: () => { UI.openSheet('right'); UI.setRTab('measures'); } },
    { label: 'Calques', onClick: () => { UI.openSheet('left'); UI.setLTab('layers'); } },
    { label: 'Assistant IA', onClick: () => AI.open() },
    { label: 'Guide', onClick: () => showGuide() },
  ]);
  document.addEventListener('keydown', (e) => {
    if (e.target.closest('input,textarea,select') || document.querySelector('.modal-back')) return;
    const k = e.key.toLowerCase();
    if ((e.ctrlKey || e.metaKey) && k === 'z') { e.preventDefault(); e.shiftKey ? History.doRedo() : History.doUndo(); return; }
    if ((e.ctrlKey || e.metaKey) && k === 'y') { e.preventDefault(); History.doRedo(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (k === 'r') setMode('orbit'); else if (k === 'p') setMode('place'); else if (k === 'd') setMode('move'); else if (k === 'm') setMode('measure');
    else if (k === 'escape') { App.select(null); S.pendingLibId = null; setMode('orbit'); }
    else if ((k === 'delete' || k === 'backspace') && S.selected) { e.preventDefault(); App.remove(S.selectedId); }
    else if (k.startsWith('arrow') && S.selected) { e.preventDefault(); const st = e.shiftKey ? 2 : 0.5; App.nudge(S.selected, k === 'arrowleft' ? -st : k === 'arrowright' ? st : 0, k === 'arrowup' ? st : k === 'arrowdown' ? -st : 0); }
  });
  // glisser-déposer d'images directement sur la scène
  const st = $('#stage');
  st.addEventListener('dragover', (e) => e.preventDefault());
  st.addEventListener('drop', (e) => { e.preventDefault(); const f = [...(e.dataTransfer.files || [])]; if (f.some(x => /\.json$/i.test(x.name))) Projects.importFile(f.find(x => /\.json$/i.test(x.name))); else Importer.files(f); });
}

// ================================================================ Plan déroulé d'un bras (« planche ») et ajouts IA
// Pourquoi : l'ancien mode « compléter » envoyait une capture de l'avatar et recevait une nouvelle image du corps entier,
// qui réinterprétait les tatouages existants. Ici, la planche est calculée à partir des VRAIS calques du projet
// (géométrie des décals + leurs images), dans le même repère que la projection « déroulée » des membres.
// Le modèle ne fournit que de l'inspiration graphique : seuls des éléments nouveaux, extraits, contrôlés
// et posés comme calques indépendants arrivent sur l'avatar. Les tatouages verrouillés ne sont jamais modifiés.

const BOARD_W = 1024, BOARD_H = 1536;

const Board = {
  // repère d'un bras : chaîne épaule (prolongée) → coude → poignet → main ; φ = 0 sur la face externe
  frame(side) {
    if (Body.isCustom || !Body.bones) return null;
    const sd = side === 'l' ? 'l' : 'r';
    const limb = Decals.limbChain('upperarm_' + sd); if (!limb) return null;
    const u = Body.bones['upperarm_' + sd];
    const out = new THREE.Vector3(Math.sign(u.a.x) || (sd === 'l' ? 1 : -1), 0, 0.3).normalize(); // vers l'extérieur, un peu vers l'avant
    const F = Decals.sweepFrame(limb.chain, u.a.clone().lerp(u.b, 0.5), out); if (!F) return null;
    const Rref = (Body.regionInfo['upperarm_' + sd] || {}).r || 0.045;

    const bw = Math.min(BOARD_W - 16, Math.round(2 * Math.PI * Rref / mpp)); // tour complet du bras (largeur au biceps)
    const bx0 = Math.round((BOARD_W - bw) / 2);

    return { side: sd, limb, F, mpp, bw, bx0, radPerPx: 2 * Math.PI / bw, wristAlong, regions: new Set(limb.regions.map(r => Body.regionNames.indexOf(r))) };
  },
  coords(B, x, y, z) { const pr = B.F.proj(x, y, z); return { phi: B.F.angle(pr), along: B.F.segs[pr.i].cum + pr.t, r: Math.hypot(pr.rx, pr.ry, pr.rz), pr }; },
  toPx(B, phi, along) { return [B.bx0 + (phi / (2 * Math.PI) + 0.5) * B.bw, along / B.mpp]; },
  // point de peau correspondant à (φ, le long) : point le plus proche d'un point situé juste sous la peau
  surfaceAt(B, phi, along) {
    const segs = B.F.segs; let i = segs.length - 1; for (let k = 0; k < segs.length; k++) if (along < segs[k].cum + segs[k].L) { i = k; break; }
    const sg = segs[i]; const ax = sg.a.clone().addScaledVector(sg.dir, clamp(along - sg.cum, 0, sg.L));
    const dir = B.F.e1[i].clone().multiplyScalar(Math.cos(phi)).addScaledVector(B.F.e2[i], Math.sin(phi));
    return Body.closest(ax.addScaledVector(dir, 0.022)); // juste sous la peau (rayon minimal d'un poignet)
  },
  surfaceAtDepth(B, phi, along, depth) {

    const dir = B.F.e1[i].clone().multiplyScalar(Math.cos(phi)).addScaledVector(B.F.e2[i], Math.sin(phi));
    return Body.closest(ax.addScaledVector(dir, depth));
  },
  // tatouages visibles posés sur ce bras (zone du bras, ou moignon de l'épaule près de l'axe)
  tattoosOn(B, list = S.tattoos) {
    return list.filter(t => t.visible && Decals.objects.get(t.id) && (B.limb.regions.includes(t.region) || (t.region === 'torso' && (() => { const s = Body.resolve(t.anchor); if (!s) return false; const c = this.coords(B, s.p.x, s.p.y, s.p.z); return c.along < B.F.segs[0].L + 0.02 && c.r < 0.12; })())));
  },
  // dessine des calques sur la planche : 'ink' = image réelle (alpha), 'foot' = emprise pleine du motif
  render(B, tattoos, kind = 'ink', ctx = null) {

    const solid = newCanvas(4, 4); { const sg = ctx2d(solid); sg.fillStyle = '#000'; sg.fillRect(0, 0, 4, 4); }
    for (const t of tattoos.slice().sort((a, b) => a.order - b.order)) {

      const geo = rec.mesh.geometry, P = geo.attributes.position.array, U = geo.attributes.uv.array, I = geo.index ? geo.index.array : null;

  const phi = ((cx - B.bx0) / B.bw - 0.5) * 2 * Math.PI, along = cy * B.mpp;

  for (const [depth, dl] of [[0.022, 0], [0.012, 0], [0.032, 0], [0.018, 0.01], [0.018, -0.01], [0.018, 0.02]]) {
    const hh = Board.surfaceAtDepth(B, phi, along + dl, depth); if (!hh) continue; const rg = Body.regionName(hh.faceIndex);
    if (B.limb.regions.includes(rg) || (rg === 'torso' && along < B.F.segs[0].L + 0.03)) { hit = hh; region = rg; break; }
  }

    id: uid('tat_'), name: meta.name, status: 'project', libId: null, imageId, region: B.limb.regions.includes(region) ? region : 'upperarm_' + B.side, zone: zoneLabel(region, s.n, s.p), anchor,

// ================================================================ Composition IA v2 : zones calculées, guide, extraction contrôlée
// Constat (capture « tournesol + roi en double ») :
//  1. le serveur demandait au modèle de « réutiliser les motifs des références » → il redessinait le roi et le damier ;
//  2. le repli « tolérant » gardait tout ce qui était hors des zones protégées, y compris ces copies ;
//  3. rien ne fixait la taille du motif principal ni n'interdisait le haut de planche qui retombe sur le torse ;
//  4. aucun contrôle de densité : l'encre du modèle était posée telle quelle (noirs pleins).

// regroupe les éléments en calques : un par zone (tournesol / feuillage / coude / avant-bras) ou un par élément
function groupParts(P, parts, perPart, mainId = -1) {
  if (perPart) return parts.map((p, k) => ({ ...p, name: 'Ajout IA ' + (k + 1) }));
  const byZ = new Map(); for (const p of parts) { const k = p.zone; if (!byZ.has(k)) byZ.set(k, []); byZ.get(k).push(p); }
  const out = [];
  for (const [z, ps] of byZ) {
    const x0 = Math.min(...ps.map(p => p.x0)), y0 = Math.min(...ps.map(p => p.y0)), x1 = Math.max(...ps.map(p => p.x0 + p.w)), y1 = Math.max(...ps.map(p => p.y0 + p.h));
    const c = newCanvas(x1 - x0, y1 - y0), g = ctx2d(c); for (const p of ps) g.drawImage(p.canvas, p.x0 - x0, p.y0 - y0);
    const zone = P.zones[z];

    out.push({ canvas: c, x0, y0, w: x1 - x0, h: y1 - y0, n: ps.reduce((s, p) => s + p.n, 0), zone: z, parts: ps.map(p => p.id), name });

function cap(s) { s = String(s || '').trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; }

// signature de forme (orientations des contours, 4×4 cases) : repère les recopies d'un motif existant (indicatif)
function shapeSig(img, crop) {
  const S = 48, c = newCanvas(S, S), g = ctx2d(c); g.fillStyle = '#fff'; g.fillRect(0, 0, S, S);
  const [sx, sy, sw, sh] = crop || [0, 0, img.width, img.height]; const k = Math.min(S / sw, S / sh), dw = sw * k, dh = sh * k;
  g.drawImage(img, sx, sy, sw, sh, (S - dw) / 2, (S - dh) / 2, dw, dh);

}
const sigSim = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

// contrôle 3D : encre posée sur une face de torse non autorisée (pectoral, dos) ou traversante ?
function torsoSpill(B, t, fix = null) {
  const rec = Decals.objects.get(t.id); if (!rec) return 0; const img = rec.mesh.material.map && rec.mesh.material.map.image; if (!img) return 0;
  const S = 128, c = newCanvas(S, S), g = ctx2d(c); g.drawImage(img, 0, 0, S, S); const a = g.getImageData(0, 0, S, S).data;
  const geo = rec.mesh.geometry, P = geo.attributes.position.array, U = geo.attributes.uv.array, I = geo.index ? geo.index.array : null; const n = I ? I.length / 3 : P.length / 9;
  let bad = 0, ink = 0; const v = new THREE.Vector3();
  for (let f = 0; f < n; f++) {
    const ids = I ? [I[f * 3], I[f * 3 + 1], I[f * 3 + 2]] : [f * 3, f * 3 + 1, f * 3 + 2];
    const u = (U[ids[0] * 2] + U[ids[1] * 2] + U[ids[2] * 2]) / 3, w = (U[ids[0] * 2 + 1] + U[ids[1] * 2 + 1] + U[ids[2] * 2 + 1]) / 3;
    if (u < 0 || u > 1 || w < 0 || w > 1) continue; const al = a[(Math.min(S - 1, Math.floor((1 - w) * S)) * S + Math.min(S - 1, Math.floor(u * S))) * 4 + 3]; if (al < 40) continue;
    ink++; v.set(0, 0, 0); for (const id of ids) v.add(new THREE.Vector3(P[id * 3], P[id * 3 + 1], P[id * 3 + 2])); v.multiplyScalar(1 / 3);
    const hit = Body.closest(v); if (!hit) continue; const rg = Body.regionName(hit.faceIndex);

}

// recopie d'un tatouage existant : corrélation normalisée de sa forme (image source droite + empreinte déroulée,
// entière et par moitiés, plusieurs échelles) sur la planche des ajouts réduite (1/8), sommes cumulées pour la vitesse,
// budget de temps et pauses régulières (l'écran ne fige pas). La fenêtre reconnue est effacée. Indicatif, pas infaillible.
async function removeCopies(B, parts, existing, thr = 0.7, dbg = null, budgetMs = 2500) {
  const K = 6, MW = Math.round(BOARD_W / K), MH = BOARD_H / K, cm = 0.01 / B.mpp, t0 = performance.now(), removed = [];
  const tick = () => new Promise(r => setTimeout(r, 0));
  const small = (src, sx, sy, sw, sh, w, hh) => { w = Math.max(3, Math.round(w)); hh = Math.max(3, Math.round(hh));
    let cur = src, cx = sx, cy = sy, cw = sw, ch = sh; // réduction par moitiés : un seul drawImage très réduit « saute » les traits fins
    while (cw > w * 2.2 || ch > hh * 2.2) { const nw = Math.max(w, Math.round(cw / 2)), nh = Math.max(hh, Math.round(ch / 2)), t = newCanvas(nw, nh), tg = ctx2d(t); tg.imageSmoothingQuality = 'high'; tg.drawImage(cur, cx, cy, cw, ch, 0, 0, nw, nh); cur = t; cx = 0; cy = 0; cw = nw; ch = nh; }
    const c = newCanvas(w, hh), g = ctx2d(c); g.imageSmoothingQuality = 'high'; g.drawImage(cur, cx, cy, cw, ch, 0, 0, w, hh);
    const d = g.getImageData(0, 0, w, hh).data, v = new Float32Array(w * hh); for (let i = 0; i < v.length; i++) v[i] = d[i * 4 + 3] / 255 * (1 - (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 765 * 0.85); return { w, h: hh, v }; };

  const board = newCanvas(BOARD_W, BOARD_H), bg = ctx2d(board); for (const p of parts) bg.drawImage(p.canvas, p.x0, p.y0);
  const M = small(board, 0, 0, BOARD_W, BOARD_H, MW, MH), W1 = M.w + 1;
  const S1 = new Float64Array(W1 * (M.h + 1)), S2 = new Float64Array(W1 * (M.h + 1));
  for (let y = 0; y < M.h; y++) { let a = 0, b = 0; for (let x = 0; x < M.w; x++) { const v = M.v[y * M.w + x]; a += v; b += v * v; S1[(y + 1) * W1 + x + 1] = S1[y * W1 + x + 1] + a; S2[(y + 1) * W1 + x + 1] = S2[y * W1 + x + 1] + b; } }
  const box = (S, x, y, w, hh) => S[(y + hh) * W1 + x + w] - S[y * W1 + x + w] - S[(y + hh) * W1 + x] + S[y * W1 + x];
  const temps = [];
  for (const { t, bm } of existing) {
    const tw = t.widthCm * cm, th = t.heightCm * cm;
    if (bm) for (const [cy, ch] of [[0, 1], [0, 0.5], [0.5, 0.5]]) temps.push({ name: t.name, src: bm, sx: 0, sy: bm.height * cy, sw: bm.width, sh: bm.height * ch, ow: tw, oh: th * ch, thr: ch === 1 ? thr : thr + 0.12 });
    const c = Board.render(B, [t], 'ink'), a = alphaOf(c); let x0 = BOARD_W, y0 = BOARD_H, x1 = -1, y1 = -1;
    for (let i = 0; i < a.length; i += 2) if (a[i] > 30) { const x = i % BOARD_W, y = (i / BOARD_W) | 0; if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }
    if (x1 >= 0) temps.push({ name: t.name, src: c, sx: x0, sy: y0, sw: x1 - x0 + 1, sh: y1 - y0 + 1, ow: x1 - x0 + 1, oh: y1 - y0 + 1, thr });
  }
  const hitsFound = [];
  for (const T0 of temps) for (const sc of [0.7, 0.78, 0.86, 0.95, 1.05, 1.17, 1.3]) {
    if (performance.now() - t0 > budgetMs) { if (dbg) dbg.push({ budget: true }); break; }
    await tick();
    const T = small(T0.src, T0.sx, T0.sy, T0.sw, T0.sh, T0.ow * sc / K, T0.oh * sc / K); const n = T.w * T.h; if (T.w >= M.w || T.h >= M.h || n < 60) continue;

      const g = ctx2d(p.canvas); g.save(); g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.fillRect(hh.x - ex - p.x0, hh.y - ey - p.y0, hh.w + 2 * ex, hh.h + 2 * ey); g.restore(); }
    removed.push({ name: hh.name, ncc: +hh.ncc.toFixed(2) });
  }

}
function imageOpaqueRatioCanvas(c) { const d = ctx2d(c).getImageData(0, 0, c.width, c.height).data; let n = 0; for (let i = 3; i < d.length; i += 16) if (d[i] > 20) n++; return n; }

// efface de l'image du calque l'encre qui tombe sur des faces interdites (torse de face/dos), puis reconstruit le calque
async function fixTorso(B, t) {
  const tris = []; const r0 = torsoSpill(B, t, tris); if (!tris.length) return r0;
  const bm = await Images.bitmap(t.imageId), c = newCanvas(bm.width, bm.height), g = ctx2d(c); g.drawImage(bm, 0, 0);
  g.globalCompositeOperation = 'destination-out'; g.fillStyle = '#000'; g.strokeStyle = '#000'; g.lineWidth = Math.max(3, c.width / 120); g.lineJoin = 'round';
  for (const tr of tris) { g.beginPath(); tr.forEach(([u, v], k) => k ? g.lineTo(u * c.width, v * c.height) : g.moveTo(u * c.width, v * c.height)); g.closePath(); g.fill(); g.stroke(); }
  t.imageId = await Images.save(await canvasToBlob(c), { w: c.width, h: c.height }); await Decals.build(t);

// ================================================================ Placement simplifié : zones prêtes à l'emploi + gestes
// Un motif se pose d'un toucher sur une zone (épaule, biceps, avant-bras…) : bon membre, bon côté,
// taille proportionnée au membre et projection « déroulée » qui suit la courbure. Ensuite : glisser, pincer, tourner.
const ZONES = [
  { k: 'epaule', l: 'Épaule', limb: 'arm', at: (F) => F.segs[0].L + 0.035, phi: 0, hf: 0.5 },
  { k: 'biceps', l: 'Haut du bras (ext.)', limb: 'arm', seg: 1, f: 0.5, phi: 0, hf: 0.6 },
  { k: 'bras-int', l: 'Haut du bras (int.)', limb: 'arm', seg: 1, f: 0.5, phi: Math.PI, hf: 0.55 },
  { k: 'coude', l: 'Coude', limb: 'arm', seg: 2, f: 0.0, phi: 0, hf: 0.3 },
  { k: 'avant-bras', l: 'Avant-bras (dessus)', limb: 'arm', seg: 2, f: 0.5, phi: 0, hf: 0.6 },
  { k: 'avant-bras-int', l: 'Avant-bras (int.)', limb: 'arm', seg: 2, f: 0.5, phi: Math.PI, hf: 0.6 },
  { k: 'poignet', l: 'Poignet', limb: 'arm', seg: 2, f: 0.9, phi: 0, hf: 0.22 },
  { k: 'main', l: 'Dos de la main', limb: 'arm', seg: 3, f: 0.35, phi: 0, hf: 0.42, maxH: 9 },
  { k: 'cuisse', l: 'Cuisse', limb: 'leg', seg: 1, f: 0.5, phi: 0, hf: 0.5 },
  { k: 'mollet', l: 'Mollet', limb: 'leg', seg: 2, f: 0.4, phi: Math.PI, hf: 0.5 },
  { k: 'tibia', l: 'Tibia', limb: 'leg', seg: 2, f: 0.45, phi: 0, hf: 0.5 },
  { k: 'cheville', l: 'Cheville', limb: 'leg', seg: 2, f: 0.92, phi: 0, hf: 0.2 },
  { k: 'pec', l: 'Pectoral', pt: (sx, lm) => [sx * 0.09, lm.chestY + 0.03, 0.3], w: 12 },
  { k: 'cotes', l: 'Côtes', pt: (sx, lm) => [sx * 0.11, lm.ribY - 0.04, 0.0], w: 12 }, // point à l'intérieur du torse : la peau la plus proche est le flanc (pas le bras)
  { k: 'ventre', l: 'Ventre', pt: (sx, lm) => [0, lm.waistY + 0.04, 0.3], w: 14, center: true },
  { k: 'omoplate', l: 'Omoplate', pt: (sx, lm) => [sx * 0.1, lm.chestY + 0.06, -0.3], w: 12 },
  { k: 'dos', l: 'Milieu du dos', pt: (sx, lm) => [0, lm.chestY, -0.3], w: 22, center: true },
  { k: 'nuque', l: 'Nuque', pt: (sx, lm) => [0, lm.head.y - 0.13, -0.2], w: 6, center: true },

const Placer = {
  side: 'r',
  frame(limb, side) {
    if (Body.isCustom || !Body.bones) return null;
    const sd = side === 'l' ? 'l' : 'r';
    const lc = Decals.limbChain((limb === 'arm' ? 'upperarm_' : 'thigh_') + sd); if (!lc) return null;
    const bn = Body.bones[(limb === 'arm' ? 'upperarm_' : 'thigh_') + sd];
    const ref = limb === 'arm' ? new THREE.Vector3(Math.sign(bn.a.x) || (sd === 'l' ? 1 : -1), 0, 0.3).normalize() : new THREE.Vector3(Math.sign(bn.a.x) * 0.25, 0, 1).normalize();
    const F = Decals.sweepFrame(lc.chain, bn.a.clone().lerp(bn.b, 0.5), ref); return F && { F, lc };
  },
  // point de peau + taille conseillée pour une zone
  target(z, side, aspect) {
    const sx = Math.sign(Body.bones['upperarm_' + (side === 'l' ? 'l' : 'r')].a.x) || 1;
    if (z.limb) {
      const fr = this.frame(z.limb, side); if (!fr) return null; const F = fr.F;
      const along = z.at ? z.at(F) : F.segs[Math.min(z.seg, F.segs.length - 1)].cum + F.segs[Math.min(z.seg, F.segs.length - 1)].L * z.f;
      const segs = F.segs; let i = segs.length - 1; for (let k = 0; k < segs.length; k++) if (along < segs[k].cum + segs[k].L) { i = k; break; }
      const sg = segs[i], ax = sg.a.clone().addScaledVector(sg.dir, clamp(along - sg.cum, 0, sg.L));
      const dir = F.e1[i].clone().multiplyScalar(Math.cos(z.phi)).addScaledVector(F.e2[i], Math.sin(z.phi));
      const hit = Body.closest(ax.clone().addScaledVector(dir, 0.02)); if (!hit) return null;
      const R = Math.max(0.02, Decals.sweepFrame(fr.lc.chain, hit.point).R0), circ = 2 * Math.PI * R * 100;
      const segL = sg.L * 100; let hCm = Math.min(z.maxH || 99, Math.max(4, segL * z.hf)), wCm = hCm * aspect;
      if (wCm > circ * 0.55) { wCm = circ * 0.55; hCm = wCm / aspect; }
      return { hit, widthCm: +wCm.toFixed(1), heightCm: +hCm.toFixed(1), mode: z.k === 'epaule' ? 'surface' : 'limb' }; // épaule : peut déborder sur le torse
    }
    const lm = Body.lm, k = Body.k, [x, y, zz] = z.pt(z.center ? 0 : sx, lm);
    const hit = Body.closest(new THREE.Vector3(x * k, y, zz * k)); if (!hit) return null;
    let wCm = z.w, hCm = wCm / aspect; if (hCm > z.w * 1.6) { hCm = z.w * 1.6; wCm = hCm * aspect; }

  },
  async addAt(lib, zoneKey, side) {
    const z = ZONES.find(q => q.k === zoneKey); const aspect = lib.w && lib.h ? lib.w / lib.h : 1;
    const tg = this.target(z, side, aspect); if (!tg) return toast('Zone indisponible sur ce modèle.', 'err');
    await App.addTattoo(lib, tg.hit, { silent: true }); const t = S.selected; if (!t) return;
    App.update(t, { widthCm: tg.widthCm, heightCm: tg.heightCm, lockRatio: true, mode: tg.mode, rotation: 0 });
    UI.flyToTattoo(t); UI.renderRight(); toast('« ' + lib.name + ' » posé : ' + z.l.toLowerCase() + (z.limb || !z.center ? (side === 'l' ? ' gauche' : ' droit(e)') : '') + '. Glissez / pincez pour ajuster.', 'ok', 4500);
  },
  moveTattoo(t, zoneKey, side) {
    if (t.locked) return toast('Motif verrouillé.');
    const z = ZONES.find(q => q.k === zoneKey); const tg = this.target(z, side, t.widthCm / t.heightCm); if (!tg) return;
    History.record(); App.moveTo(t, tg.hit); App.update(t, { mode: tg.mode }); UI.flyToTattoo(t); UI.renderRight(); UI.renderLayers(); Save.mark();
  },
  // sélecteur : côté + zones (gros boutons, adapté au doigt)
  menu(anchorEl, onPick, allowFree, onFree) {
    const body = h('div');
    const m = openModal({ title: 'Où poser le motif ?', body });
    const draw = () => {
      body.innerHTML = '';
      body.append(UI.seg([['l', 'Côté gauche'], ['r', 'Côté droit']], this.side, (v) => { this.side = v; draw(); }));
      const grid = (title, list) => h('div', { class: 'sec' }, h('h4', {}, title), h('div', { style: { display: 'grid', gridTemplateColumns: 'repeat(auto-fill,minmax(150px,1fr))', gap: '8px' } },
        list.map(z => h('button', { class: 'btn', style: { padding: '14px 8px' }, onclick: () => { m.close(); onPick(z.k, this.side); } }, z.l))));
      body.append(grid('Bras', ZONES.filter(z => z.limb === 'arm')), grid('Jambe', ZONES.filter(z => z.limb === 'leg')), grid('Tronc', ZONES.filter(z => !z.limb)));
      if (allowFree) body.append(h('button', { class: 'btn ghost', style: { width: '100%', marginTop: '6px' }, onclick: () => { m.close(); onFree(); } }, 'Ou touchez vous-même un endroit du corps…'));
    };
    draw();
  },
};
