# InkBody — service IA optionnel (Cloudflare Workers)
name = "inkbody-ai"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
# Origine(s) autorisée(s), séparées par des virgules (votre site GitHub Pages)
ALLOWED_ORIGINS = "https://VOTRE-UTILISATEUR.github.io"
OPENAI_IMAGE_MODEL = "gpt-image-1"
IMAGE_QUALITY = "medium"
MAX_PER_IP_PER_DAY = "20"
MAX_PER_DAY = "150"

# Quota quotidien (créez le namespace : npx wrangler kv namespace create QUOTA, puis collez l'id)
[[kv_namespaces]]
binding = "QUOTA"
id = "REMPLACEZ_PAR_L_ID_DU_NAMESPACE"

# Limiteur de débit Cloudflare (optionnel) : 5 requêtes / minute / IP
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (jamais dans ce fichier) :
#   npx wrangler secret put OPENAI_API_KEY
#   npx wrangler secret put ACCESS_CODE      (facultatif mais recommandé)
